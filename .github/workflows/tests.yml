name: synthetic-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    # Pin to the supported Microsoft PowerShell repository release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install PowerShell for USB copier tests
        run: |
          set -euo pipefail
          source /etc/os-release
          package_dir="$(mktemp -d "${RUNNER_TEMP:?}/powershell-repo.XXXXXX")"
          trap 'rm -f -- "$package_dir/packages-microsoft-prod.deb"; rmdir -- "$package_dir"' EXIT
          wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -O "$package_dir/packages-microsoft-prod.deb"
          sudo dpkg -i "$package_dir/packages-microsoft-prod.deb"
          sudo apt-get update
          sudo apt-get install -y powershell
          pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/verify_clean_install.py --source .
      - run: python tools/privacy_scan.py
      - run: sha256sum -c FILE_MANIFEST.sha256
      - run: python tools/build_release.py --output "${{ runner.temp }}/bot-release"
